<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Cubano";src:url("../assets/fonts/Cubano.otf") format("opentype");font-weight:400;font-style:normal}
html,body{margin:0;padding:0;width:1080px;height:1350px}
.cub{font-family:"Cubano","Arial Black",sans-serif;font-weight:400}
</style>
</head>
<body>
<!-- Lámina de tips. Campos: num, title, body, photo, alt, page, foco (opcional, encuadre CSS, p. ej. "50% 30%").
     La foto se muestra completa en su proporción (sin recortar personas); el texto ocupa el resto. -->
<div style="width:1080px;height:1350px;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;color:#363636;font-family:'Ubuntu','Helvetica Neue',Arial,sans-serif;overflow:hidden">
<div style="flex:1 1 auto;min-height:0;box-sizing:border-box;padding:64px 88px 40px;display:flex;flex-direction:column;justify-content:center;gap:28px">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="cub" style="font-size:84px;line-height:1;color:#4bb748">{{num}}</div>
<div style="display:flex;align-items:center;gap:20px">
<span style="font-size:28px;font-weight:500">{{page}}</span>
<img src="../assets/logos/isotipo-color.png" alt="" style="width:56px;height:auto">
</div>
</div>
<h2 class="cub" style="margin:0;font-size:68px;line-height:1.05;color:#363636">{{title}}</h2>
<p style="margin:0;font-size:38px;line-height:54px;font-weight:400;color:#363636">{{body}}</p>
</div>
<img src="{{photo}}" alt="{{alt}}" style="flex:0 0 auto;display:block;width:100%;height:auto;max-height:760px;object-fit:cover;object-position:{{foco}}">
</div>
</body>
</html>
