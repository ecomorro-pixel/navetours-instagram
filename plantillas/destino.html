<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Cubano";src:url("../assets/fonts/Cubano.otf") format("opentype");font-weight:400;font-style:normal}
html,body{margin:0;padding:0;width:1080px;height:1350px}
.cub{font-family:"Cubano","Arial Black",sans-serif;font-weight:400}
</style>
</head>
<body>
<!-- Destino destacado. Campos: eyebrow, title, line, photo, alt, foco (opcional) -->
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#333332;font-family:'Ubuntu','Helvetica Neue',Arial,sans-serif;color:#fff">
<img src="{{photo}}" alt="{{alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{foco}}">
<div style="position:absolute;left:0;right:0;bottom:0;height:640px;background:rgba(0,0,0,0.5)"></div>
<img src="../assets/logos/isotipo-blanco.png" alt="Nave Tours" style="position:absolute;top:72px;right:80px;width:88px;height:auto">
<div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 88px 96px;display:flex;flex-direction:column;gap:24px">
<div class="cub" style="font-size:34px;line-height:1.2;letter-spacing:1px">{{eyebrow}}</div>
<h1 class="cub" style="margin:0;font-size:150px;line-height:0.95;text-shadow:0 0 10px rgba(0,0,0,0.3)">{{title}}</h1>
<p style="margin:0;font-size:38px;line-height:52px;font-weight:300;max-width:860px">{{line}}</p>
</div>
</div>
</body>
</html>
