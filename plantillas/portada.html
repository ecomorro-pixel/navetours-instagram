<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Cubano";src:url("../assets/fonts/Cubano.otf") format("opentype");font-weight:400;font-style:normal}
html,body{margin:0;padding:0;width:1080px;height:1350px}
.cub{font-family:"Cubano","Arial Black",sans-serif;font-weight:400}
</style>
</head>
<body>
<!-- Portada de carrusel. Campos: eyebrow, title, subtitle, photo, alt, page -->
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#333332;font-family:'Ubuntu','Helvetica Neue',Arial,sans-serif;color:#fff">
<img src="{{photo}}" alt="{{alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;background:rgba(0,0,0,0.42)"></div>
<div style="position:absolute;inset:0;box-sizing:border-box;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between">
<img src="../assets/logos/isologo-blanco.png" alt="Nave Tours" style="width:168px;height:auto;align-self:flex-start">
<div style="display:flex;flex-direction:column;gap:28px">
<div class="cub" style="font-size:34px;line-height:1.2;letter-spacing:1px;text-shadow:0 0 10px rgba(0,0,0,0.3)">{{eyebrow}}</div>
<h1 class="cub" style="margin:0;font-size:112px;line-height:1;text-shadow:0 0 10px rgba(0,0,0,0.3)">{{title}}</h1>
<p style="margin:0;font-size:40px;line-height:52px;font-weight:300;max-width:820px">{{subtitle}}</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:36px;font-size:28px;font-weight:500">
<span>{{page}}</span>
<span style="display:flex;align-items:center;gap:12px">Swipe
<svg width="40" height="24" viewBox="0 0 40 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h34M26 3l10 9-10 9"></path></svg>
</span>
</div>
</div>
</div>
</div>
</body>
</html>
